schema_version: "1.1"
name: functionize-cross-call
tags: [functionize, routing, cross-call, fixture]
plugins: ["../.."]
runs: 2
context:
  scaffold_script: scripts/setup-fixture.sh
execution:
  prompt: |
    Functionize the repeated procedure across adjacent Bash calls in this eval's synthetic
    history. Use only $HOME/.functionize-eval/capture.jsonl, never real agent histories.
    Mine recipes with --capture-file "$HOME/.functionize-eval/capture.jsonl"
    and --cross-call --max-calls 4 --max-glue 1 --eligible-only --json.
    Do not export, record decisions, stage, promote, approve for execution, or run anything.
    For every CLI or plugin launcher call, explicitly prefix the command with
    RHIZE_SKILL_BIN="$HOME/dev-local/RHIZE/procedural-memory/.venv/bin/rhize-skill"
    so another installed CLI cannot be selected. Use only this synthetic fixture.
  max_turns: 14
  timeout_seconds: 180
  allowed_tools: [Bash, Skill]
  env:
    EVAL_FIXTURE_MODE: "true"
