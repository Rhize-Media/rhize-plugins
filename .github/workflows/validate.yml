name: validate

# Static release contracts; Claude is used only for plugin manifest validation.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.wolf/**'
      - '!STATE.md'
      # Shipped instructions and operational references are executable plugin inputs.
      - '*/skills/**'
      - '*/commands/**'
      - '*/agents/**'
      - '*/references/**'
      - '*/templates/**'
      - '*/docs/**'
      - '*/.codex-plugin/migrated-command-skills/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.wolf/**'
      - '!STATE.md'
      # Shipped instructions and operational references are executable plugin inputs.
      - '*/skills/**'
      - '*/commands/**'
      - '*/agents/**'
      - '*/references/**'
      - '*/templates/**'
      - '*/docs/**'
      - '*/.codex-plugin/migrated-command-skills/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/package-lock.json
      - name: Install pinned static validator
        run: |
          npm ci --prefix .github --ignore-scripts --no-audit --no-fund
          node .github/node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Add static manifest validator to PATH
        run: echo "$PWD/.github/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run pytest suite
        run: python3 -m pytest -q
      - name: Validate plugin manifests (repo root)
        run: claude plugin validate --strict .
      - name: Validate plugin manifests (per plugin)
        run: |
          for d in */; do
            if [ -f "$d/.claude-plugin/plugin.json" ]; then
              claude plugin validate --strict "$d"
            fi
          done
      - name: Lint plugin hooks.json / .mcp.json configs
        run: python3 scripts/validate_plugin_configs.py
      - name: Dev Flow doctor
        run: CLAUDE_PLUGIN_ROOT=$PWD/rhize-devflow python3 rhize-devflow/scripts/devflow.py doctor
      - name: Skill-map freshness
        run: python3 scripts/validate_skill_map.py --check-stale
      - name: Setup-artifacts freshness
        run: python3 rhize-core/scripts/setup_artifacts.py --check
      - name: Skill-map docs render is idempotent
        run: |
          python3 scripts/render_skill_map_docs.py
          python3 scripts/render_skill_map_docs.py | tee /tmp/render_second_run.txt
          grep -q "No changes" /tmp/render_second_run.txt
      - name: Validate version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/bump_version.py --check --since "origin/$BASE_REF"
