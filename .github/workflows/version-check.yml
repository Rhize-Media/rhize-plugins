name: version-check

# Pre-merge gate: if a PR changes any plugin, fail unless its version, the marketplace
# top-level version, and the CHANGELOG were bumped. Mirrors the local .githooks/pre-push.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # bump_version.py --check runs the Dev Flow pytest suite (added in e2fe5e2,
      # 2026-08-16). ubuntu-latest's system python3 has no pytest, so the gate
      # reported "Dev Flow test suite failed" on every PR since — a false failure:
      # the suite never ran at all.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PyYAML too: ubuntu's SYSTEM python3 ships it, but actions/setup-python
      # provides a clean interpreter that does not. build_skill_map.py needs it to
      # parse SKILL.md frontmatter — without it no topic-tag nodes are emitted and
      # the map build dies on a dangling edge, failing --check-stale.
      - run: pip install pytest pyyaml
      - name: Validate version bumps
        run: |
          python3 scripts/bump_version.py --check --since "origin/${{ github.base_ref }}"
