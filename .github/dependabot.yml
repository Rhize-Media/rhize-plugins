version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      tools-minor-patch:
        update-types: [minor, patch]
